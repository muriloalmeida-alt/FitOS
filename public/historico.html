<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
  /* ---------- Tokens (mesmos de carreira.html — Modo Técnico) ---------- */
  :root{
    --mt-navy-950:#060D1A; --mt-navy-900:#0A1628; --mt-navy-800:#0F2038;
    --mt-navy-700:#16304F; --mt-navy-600:#1F3E63;
    --mt-gold-300:#F5D68A; --mt-gold-400:#E8B84B; --mt-gold-600:#B8860B; --mt-gold-800:#7A5A08;
    --mt-ivory-50:#F5F1E6; --mt-ivory-100:#E8E2D0;
    --mt-ink-muted:#8FA3BF; --mt-ink-faint:#5C7192;
    --font:'Inter', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }
  /* Pedido do usuário: "bloquear zoom em qualquer situação" — mesmo
     ajuste de carreira.html (touch-action bloqueia o duplo-toque de
     ampliar; o meta viewport, no <head>, bloqueia o pinch-zoom). */
  html, body{ margin:0; background:var(--mt-navy-950); touch-action:manipulation; }
  body{
    min-height:100vh; color:var(--mt-ivory-100); font-family:var(--font);
    background:linear-gradient(180deg, var(--mt-navy-900) 0%, var(--mt-navy-950) 60%, #030811 100%);
    padding-bottom:40px;
  }

  /* ---------- Topbar (mesmo padrão de .mt-topbar/.mt-brand-mini) ---------- */
  /* BUG CORRIGIDO (relato do usuário, com print: "todas as telas estão
     sendo sobrepostas pelo relógio do celular") — mesmo mecanismo
     aplicado em carreira.html (.mt-topbar/.m3-topbar/.mt-live-topbar). */
  .mt-topbar{
    position:sticky; top:0; z-index:5;
    background:linear-gradient(180deg, rgba(6,13,26,.97), rgba(6,13,26,.9));
    backdrop-filter:blur(6px); border-bottom:1px solid var(--mt-navy-600);
    padding:calc(16px + env(safe-area-inset-top, 0px)) 18px 16px;
  }
  .mt-topbar-row{ display:flex; align-items:center; gap:12px; }
  .mt-back-btn{
    width:34px; height:34px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:var(--mt-navy-800); border:1px solid var(--mt-navy-600); color:var(--mt-ink-muted); cursor:pointer;
  }
  .mt-back-btn svg{ width:17px; height:17px; }
  .mt-crest-mini{ width:30px; height:30px; flex-shrink:0; }
  .mt-crest-mini img{ height:100%; width:100%; object-fit:contain; }
  .mt-topbar-title{ min-width:0; }
  .mt-topbar-title .t{ font-family:'Bebas Neue', var(--font); font-size:18px; letter-spacing:1.5px; color:var(--mt-ivory-50); line-height:1.1; }
  .mt-topbar-title .t span{ color:var(--mt-gold-400); }
  .mt-topbar-title .sub{ font-family:'Rajdhani', var(--font); font-weight:700; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--mt-ink-faint); margin-top:1px; }

  .wrap{ max-width:520px; margin:0 auto; padding:20px 16px 0; }
  .wrap p.lede{ font-size:13px; color:var(--mt-ink-muted); line-height:1.55; margin:0 0 22px; }

  /* ---------- Lista de versões ---------- */
  .version-list{ display:flex; flex-direction:column; gap:12px; }
  .version-card{
    display:flex; align-items:center; gap:14px; text-align:left; width:100%;
    background:linear-gradient(160deg, var(--mt-navy-700), var(--mt-navy-800) 65%);
    border:1px solid var(--mt-navy-600); border-top:1px solid rgba(232,184,75,.22);
    clip-path:polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%);
    padding:16px 18px; cursor:pointer; color:inherit; font:inherit;
  }
  .version-card:hover{ border-color:var(--mt-gold-600); }
  .version-card:focus-visible{ outline:2px solid var(--mt-gold-400); outline-offset:2px; }
  .version-tag{
    flex-shrink:0; width:64px; text-align:center;
    font-family:'Bebas Neue', var(--font); font-size:22px; letter-spacing:.5px;
    color:var(--mt-navy-950); background:linear-gradient(180deg, var(--mt-gold-300), var(--mt-gold-600));
    border-radius:8px; padding:6px 0 4px;
  }
  .version-body{ flex:1; min-width:0; }
  .version-date{ font-family:'Rajdhani', var(--font); font-weight:700; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--mt-ink-faint); }
  .version-title{ font-family:'Bebas Neue', var(--font); font-size:18px; letter-spacing:.3px; color:var(--mt-ivory-50); margin:2px 0 3px; }
  .version-summary{ font-size:12.5px; color:var(--mt-ink-muted); line-height:1.4; }
  .version-chevron{ flex-shrink:0; width:18px; height:18px; color:var(--mt-ink-faint); }

  footer.page-foot{ text-align:center; margin-top:26px; }
  footer.page-foot p{ font-size:11.5px; color:var(--mt-ink-faint); margin:0; }

  /* ---------- Modal de detalhes (mesmo padrão .ct-modal-overlay bottom-sheet) ---------- */
  .ct-modal-overlay{
    position:fixed; inset:0; z-index:200; display:none;
    align-items:flex-end; justify-content:center;
    background:rgba(3,8,17,.72);
  }
  .ct-modal-overlay.open{ display:flex; }
  .ct-modal{
    width:100%; max-width:520px; max-height:82vh; display:flex; flex-direction:column;
    background:linear-gradient(160deg, var(--mt-navy-700), var(--mt-navy-800) 65%);
    border:1px solid var(--mt-navy-600); border-bottom:none;
    border-radius:16px 16px 0 0; overflow:hidden;
  }
  .ct-modal-header{ display:flex; align-items:flex-start; gap:12px; padding:18px 18px 14px; border-bottom:1px solid var(--mt-navy-600); flex-shrink:0; }
  .ct-modal-header .version-tag{ margin-top:1px; }
  .ct-modal-header-text{ flex:1; min-width:0; }
  .ct-modal-header-text h3{ font-family:'Bebas Neue', var(--font); font-size:20px; letter-spacing:.3px; color:var(--mt-ivory-50); margin:2px 0 2px; }
  .ct-modal-sub{ font-family:'Rajdhani', var(--font); font-weight:700; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--mt-ink-faint); }
  .ct-modal-close{
    width:30px; height:30px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:var(--mt-navy-800); border:1px solid var(--mt-navy-600); color:var(--mt-ink-muted); cursor:pointer; font-size:14px;
  }
  .ct-modal-body{ flex:1; overflow-y:auto; padding:16px 18px 20px; }
  .item-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px; }
  .item-list li{ display:flex; align-items:flex-start; gap:10px; font-size:13.5px; line-height:1.5; color:var(--mt-ivory-100); }
  .item-list li::before{
    content:''; flex-shrink:0; margin-top:6px; width:7px; height:7px; border-radius:50%;
    background:linear-gradient(180deg, var(--mt-gold-300), var(--mt-gold-600));
  }
  .ct-modal-footer{ padding:14px 18px; border-top:1px solid var(--mt-navy-600); flex-shrink:0; }
  .mt-btn-ghost{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Rajdhani', var(--font); font-weight:600; font-size:14px; letter-spacing:.5px;
    padding:12px; border-radius:999px; cursor:pointer; background:transparent; border:1.5px solid var(--mt-navy-600); color:var(--mt-ivory-100);
  }
</style>
</head>

  <div class="mt-topbar">

      </div>
      <div class="ct-modal-footer">
        <button class="mt-btn-ghost" id="modalCloseFooter">Fechar</button>
      </div>
    </div>
  </div>

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function renderList() {
    document.getElementById("versionList").innerHTML = VERSIONS.map((v, i) => `
      <button class="version-card" data-index="${i}">
        <div class="version-tag">${escapeHtml(v.version)}</div>
        <div class="version-body">
          <div class="version-date">${escapeHtml(v.date)}</div>
          <div class="version-title">${escapeHtml(v.title)}</div>
          <div class="version-summary">${escapeHtml(v.summary)}</div>
        </div>
        <svg class="version-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>`).join("");
    document.querySelectorAll(".version-card").forEach((btn) => {
      btn.addEventListener("click", () => openVersion(VERSIONS[Number(btn.dataset.index)]));
    });
  }

  function openVersion(v) {
    document.getElementById("modalVersionTag").textContent = v.version;
    document.getElementById("modalDate").textContent = v.date;
    document.getElementById("modalTitle").textContent = v.title;
    document.getElementById("modalItems").innerHTML = v.items.map((it) => `<li>${escapeHtml(it)}</li>`).join("");
    document.getElementById("versionOverlay").classList.add("open");
  }
  function closeModal() { document.getElementById("versionOverlay").classList.remove("open"); }

  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("modalCloseFooter").addEventListener("click", closeModal);
  document.getElementById("versionOverlay").addEventListener("click", (e) => { if (e.target.id === "versionOverlay") closeModal(); });
  document.getElementById("btnBack").addEventListener("click", () => { window.location.href = "carreira.html"; });

  renderList();
</script>
